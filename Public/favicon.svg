<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="sealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C7181F" />
      <stop offset="45%" stop-color="#9E1217" />
      <stop offset="100%" stop-color="#6E0B0E" />
    </linearGradient>
    <linearGradient id="sealBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA49E" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#800D11" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F5EFE6" />
      <stop offset="100%" stop-color="#E2D7C5" />
    </linearGradient>
    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Hanko Rounded Lacquer Seal -->
  <rect
    x="8"
    y="8"
    width="104"
    height="104"
    rx="26"
    fill="url(#sealBg)"
    stroke="url(#sealBorder)"
    stroke-width="1.8"
    filter="url(#sealShadow)"
  />

  <!-- Subtle Inset Craft Line -->
  <rect
    x="14"
    y="14"
    width="92"
    height="92"
    rx="20"
    fill="none"
    stroke="#F5EFE6"
    stroke-opacity="0.12"
    stroke-width="1"
  />

  <!-- Katana S Monogram (Upper Blade & Loop) -->
  <path
    d="M 60 25
       L 76 39
       L 64 47
       C 61 44 56 40 50 41
       C 43 43 40 48 41 54
       C 42 61 48 66 56 71
       L 64 76
       C 75 82 82 89 80 99
       C 79 104 74 107 70 107
       L 68 97
       C 72 96 73 93 73 90
       C 72 84 66 79 59 75
       L 51 70
       C 39 63 34 54 36 43
       C 38 31 50 25 60 25 Z"
    fill="url(#bladeGrad)"
  />

  <!-- Katana S Monogram (Lower Blade & Counter Balance) -->
  <path
    d="M 60 95
       L 44 81
       L 56 73
       C 59 76 64 80 70 79
       C 77 77 80 72 79 66
       C 78 59 72 54 64 49
       L 56 44
       C 45 38 38 31 40 21
       C 41 16 46 13 50 13
       L 52 23
       C 48 24 47 27 47 30
       C 48 36 54 41 61 45
       L 69 50
       C 81 57 86 66 84 77
       C 82 89 70 95 60 95 Z"
    fill="url(#bladeGrad)"
    opacity="0.95"
  />

  <!-- Center Energy Core Notch -->
  <polygon points="56,58 64,54 64,62 56,66" fill="#730B0F" opacity="0.65" />
</svg>
